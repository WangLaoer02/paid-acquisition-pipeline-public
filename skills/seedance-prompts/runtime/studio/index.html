<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Seedance · Skill 运行排查</title><link rel="stylesheet" href="monitor.css"><script src="monitor.js" defer></script></head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><strong>Seedance</strong><span>11 个 Skill · 运行排查</span></div></div><div class="views" aria-label="查看方式"><button id="view-runs" class="view-button active" aria-pressed="true">运行记录</button><button id="view-issues" class="view-button" aria-pressed="false">按问题查看</button></div><div class="top-end"><span id="sync-state" role="status">正在读取</span><button class="button quiet" id="refresh">刷新</button></div></header>
  <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="搜索要求、Skill、步骤或问题" placeholder="搜索要求、Skill、步骤或问题"></label><select id="skill-filter" aria-label="按 Skill 筛选"><option value="">全部 11 个 Skill</option></select><select id="category-filter" aria-label="按问题类型筛选"><option value="">全部问题类型</option></select><select id="issue-status-filter" aria-label="按问题状态筛选"><option value="">全部问题状态</option><option value="open">新发现</option><option value="working">处理中</option><option value="resolved">已解决</option></select><select id="time-filter" aria-label="按时间筛选"><option value="all">全部时间</option><option value="today">今天</option><option value="week">最近 7 天</option></select><label class="check"><input id="only-issues" type="checkbox">只看有问题的运行</label><label class="check test-filter"><input id="show-tests" type="checkbox" checked>显示测试</label><span class="count" id="list-count"></span></div>
  <main class="workbench">
    <aside class="run-column" aria-label="运行列表"><div class="column-heading"><h1 id="list-heading">全部运行</h1><span id="run-count"></span></div><div id="run-list" class="run-list"><p class="empty">正在读取运行记录…</p></div></aside>
    <section class="process-column" aria-label="运行过程"><div id="run-heading" class="run-heading"></div><div id="timeline" class="timeline"></div></section>
    <section class="detail-column" aria-label="排查详情"><div class="column-heading"><h2 id="detail-heading">运行概览</h2><button class="button quiet" id="copy-analysis" disabled>复制给 Agent 排查</button></div><div id="step-detail" class="step-detail"><p class="empty">选择一次运行查看要求、过程和结果</p></div></section>
  </main>
  <dialog id="issue-dialog" aria-labelledby="issue-dialog-title"><form id="issue-form"><div class="dialog-heading"><h2 id="issue-dialog-title">记录问题</h2><button type="button" class="button quiet" data-close="issue-dialog" aria-label="关闭问题窗口">关闭</button></div><div id="issue-location" class="minor"></div><label class="field-label" for="issue-title">哪里不符合要求</label><input id="issue-title" class="field" placeholder="用一句话描述具体问题" required maxlength="240"><div class="form-pair"><div><label class="field-label" for="issue-category">问题类型</label><select id="issue-category" class="field"></select></div><div><label class="field-label" for="issue-skill">关联 Skill</label><select id="issue-skill" class="field"></select></div></div><label class="field-label" for="issue-expected">希望怎样</label><textarea id="issue-expected" class="field" rows="2" placeholder="对应哪条用户要求或 Skill 规则"></textarea><label class="field-label" for="issue-actual">实际怎样</label><textarea id="issue-actual" class="field" rows="3" placeholder="实际行为、返回内容或结果"></textarea><details class="issue-more"><summary>补充依据、原因与改法</summary><label class="field-label" for="issue-basis">判断依据</label><textarea id="issue-basis" class="field" rows="2" placeholder="指出具体输入、规则或步骤"></textarea><label class="field-label" for="issue-cause">原因</label><textarea id="issue-cause" class="field" rows="2"></textarea><label class="field-label" for="issue-fix">改法</label><textarea id="issue-fix" class="field" rows="2"></textarea></details><details class="issue-more"><summary>关联文件或视频位置</summary><label class="field-label" for="issue-file">关联文件</label><select id="issue-file" class="field"></select><label class="field-label" for="issue-position">视频位置（秒，可选）</label><input id="issue-position" class="field" type="number" min="0" max="86400" step="0.1"></details><div class="dialog-actions"><button type="submit" class="button primary">保存问题</button></div></form></dialog>
  <dialog id="compare-dialog" class="compare-dialog" aria-labelledby="compare-title"><div class="dialog-heading"><h2 id="compare-title">对照运行</h2><button class="button quiet" data-close="compare-dialog" aria-label="关闭对照窗口">关闭</button></div><p id="compare-problem" class="minor"></p><label class="field-label" for="compare-select">选择要对照的运行</label><select id="compare-select" class="field"></select><div id="comparison" class="comparison"></div><div class="dialog-actions"><button id="link-comparison" class="button primary">关联到这条问题</button></div></dialog>
  <dialog id="snapshot-dialog" class="compare-dialog" aria-labelledby="snapshot-title"><div class="dialog-heading"><h2 id="snapshot-title">本次 Skill 快照</h2><button class="button quiet" data-close="snapshot-dialog" aria-label="关闭 Skill 快照">关闭</button></div><div id="snapshot-content"></div></dialog>
  <dialog id="recording-dialog" aria-labelledby="recording-title"><div class="dialog-heading"><h2 id="recording-title">记录后续执行过程</h2><button class="button quiet" data-close="recording-dialog" aria-label="关闭过程记录说明">关闭</button></div><p>11 个 Skill 共用同一入口。记录调用原因、实际读取的参考、工具输入与返回、结果检查；记录随运行进入时间线。</p><pre id="recording-command"></pre><button id="copy-recording" class="button primary">复制接入方式</button></dialog>
  <dialog id="export-dialog" class="compare-dialog" aria-labelledby="export-title"><div class="dialog-heading"><h2 id="export-title">本次排查记录</h2><button class="button quiet" data-close="export-dialog" aria-label="关闭导出窗口">关闭</button></div><p class="minor">包含原要求、运行过程、问题，以及本次 Skill 正文和参考版本。媒体保留原路径。</p><label class="field-label" for="export-json">Agent 可读 JSON</label><textarea id="export-json" class="field" rows="14" readonly></textarea><div class="dialog-actions"><a id="download-inspection" class="button">下载 JSON</a><button id="copy-export" class="button primary">复制 JSON</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body></html>
